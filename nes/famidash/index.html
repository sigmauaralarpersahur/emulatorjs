<html>

<head>
    <script>
        (async function() {
            const fallbackUrls = [
                "https://cdn.jsdelivr.net/gh/",
                "https://fastly.jsdelivr.net/gh/",
                "https://gcore.jsdelivr.net/gh/",
                "https://testingcf.jsdelivr.net/gh/",
                "https://quantil.jsdelivr.net/gh/",
                "https://originfastly.jsdelivr.net/gh/",
                "https://esm.sh/gh/",
                "https://cdn.statically.io/gh/",
                "https://cdn.staticdelivr.com/gh/"
            ];

            const pathSuffix = "marty-games/mga-emulatorjs@main/nes/famidash/";
            let chosenBase = fallbackUrls[0];

            for (const url of fallbackUrls) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 2500);

                    const response = await fetch(url + pathSuffix + "index.html", {
                        method: "HEAD",
                        mode: "cors",
                        signal: controller.signal
                    });

                    clearTimeout(timeoutId);

                    if (response.ok) {
                        chosenBase = url;
                        break;
                    }
                } catch (e) {
                    console.warn(`${url} failed, trying next fallback...`);
                }
            }

            const finalBaseUrl = chosenBase + pathSuffix;
            let base = document.querySelector("base") || document.createElement("base");
            base.href = finalBaseUrl;

            if (!document.querySelector("base")) {
                document.head.prepend(base);
            }

            console.log("Base URL successfully set to: " + finalBaseUrl);
        })();
    </script>
    <script src="//www.google.com/jsapi"></script>
    <script>
        window.parent.maeExportApis_();
    </script>

    <style>
        body {
            overflow: hidden;
            background: #000000;
            margin-top: 0;
            margin-left: 0;
            color: #000000;
        }

        #startButton {
            display: block;
            width: 160px;
            height: 40px;
            background-color: #4caf50;
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 16px;
            margin: 20px auto;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: "Press Start 2P", cursive;
            box-shadow: 0px 0px 10px 2px #000000;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap" rel="stylesheet" />
    <style type="text/css">
        #button {
            display: none;
        }

        .imgb_vis {
            animation: imgb-animation 7s linear;
        }

        @keyframes imgb-animation {
            10% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(100px);
            }

            90% {
                transform: translateX(100px);
            }

            100% {
                transform: translateX(0);
            }
        }
    </style>
</head>

<body>
    <div style="width: 100vw; height: 100vh; max-width: 100%">
        <div id="game" style="display: none"></div>
        <button id="startButton">PLAY</button>
    </div>
    <script>
        document.getElementById("game").style.display = "none";

        function startGame() {
            document.getElementById("game").style.display = "block";
            document.getElementById("startButton").style.display = "none";
            EJS_player = "#game";
            EJS_core = "gba";
            EJS_color = "#000000";
            EJS_startOnLoaded = true;
            EJS_pathtodata = "https://gcore.jsdelivr.net/gh/martinmmcyt/emulatorjs@master/";
            EJS_gameUrl =
                "Famidash.v1.2.8.nes";
            loadGame();
        }
        document
            .getElementById("startButton")
            .addEventListener("click", startGame);

        function loadGame() {
            var script = document.createElement("script");
            script.src = "https://gcore.jsdelivr.net/gh/martinmmcyt/emulatorjs@master/loader.js";
            document.body.appendChild(script);
        }
    </script>
</body>

</html>
